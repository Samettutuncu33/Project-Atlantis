name: Atlantis hourly simulation
# Trading loop: plain Python. Each run replays every hourly bar since the last run, so results are identical to hourly runs.
# AI agents: Claude API via the ANTHROPIC_API_KEY repo secret, budget-capped in scripts/ai_api_runner.py.
# Without the secret the AI steps print SKIP and the simulation still runs.
on:
  schedule:
    - cron: "7,37 * * * 1-5"   # twice an hour Mon-Fri: GitHub starts scheduled runs late or drops them, so ask more often
  workflow_dispatch: {}
concurrency:
  group: atlantis-live
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  step:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q -e . lightgbm scikit-learn anthropic
      - name: AI agents via Claude API (daily news + analyst once per bar; hourly analyst at most every 5 hours)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/ai_api_runner.py daily
          python scripts/ai_api_runner.py hourly
      - name: Simulation step (exit 2 = a check failed; outputs still published)
        run: python -m atlantis.live step || [ $? -eq 2 ]
      - name: Status page for GitHub (live/STATUS.md)
        continue-on-error: true
        run: python scripts/write_status.py
      - name: Commit and push results
        run: |
          git config user.name "Atlantis bot"
          git config user.email "atlantis-bot@users.noreply.github.com"
          git add live/ knowledge/ data/llm/ data/raw/dukascopy_live/ || true
          git diff --cached --quiet && exit 0
          git commit -qm "hourly simulation $(date -u +%Y-%m-%dT%H:%MZ) [actions]"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep $((i*5)); done
          exit 1
      - name: Build phone dashboard (GitHub Pages)
        continue-on-error: true
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
